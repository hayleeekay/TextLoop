spring.application.name=textloop

spring.datasource.url=jdbc:postgresql://localhost:5432/textloop
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
# Driver exception text can contain payloads. Failures still propagate to the caller.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.orm.jdbc.warn=OFF
