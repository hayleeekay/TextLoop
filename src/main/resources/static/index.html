<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TextLoop</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header>
  <div class="header-inner">
    <p class="brand">Text<span>Loop</span></p>
    <nav aria-label="Reminders">
      <button id="messages-tab" type="button" aria-current="page" data-navigation>Messages</button>
      <button id="home" type="button" data-navigation>Schedule</button>
      <button id="history-tab" type="button" data-navigation>History</button>
      <button id="settings-tab" type="button" data-navigation>Settings</button>
    </nav>
  </div>
</header>
<main>
  <p id="notice" role="status" aria-live="polite"></p>
  <p id="toast" role="status"></p>
  <section id="saved-retry" hidden aria-label="Unconfirmed save"></section>
  <section id="editor" class="composer" hidden aria-labelledby="conversation-title">
    <div id="conversation">
      <div class="view-heading contact">
        <span class="avatar" aria-hidden="true">M</span>
        <h1 id="conversation-title" tabindex="-1">Future me ✨</h1>
      </div>
      <ol id="thread" aria-label="Recent and scheduled messages"></ol>
    </div>
    <form id="reminder-form" class="panel">
      <fieldset id="fields" disabled>
        <legend class="sr-only">Reminder details</legend>
        <div class="time-inputs" role="group" aria-label="Send later">
          <div class="schedule-field">
            <label for="send-date">Date</label>
            <input id="send-date" type="date" required>
          </div>
          <div class="schedule-field">
            <label for="send-time">Time</label>
            <input id="send-time" type="time" step="60" required>
          </div>
        </div>
        <div class="message-input">
          <button id="cancel" class="quiet" type="button" aria-label="Cancel edit" hidden>×</button>
          <label for="message" id="message-label">Message</label>
          <textarea id="message" name="message" maxlength="1000" rows="2" placeholder="Message" required></textarea>
          <button id="save" type="submit" class="primary">Schedule text</button>
        </div>
      </fieldset>
    </form>
    <div id="composer-space" aria-hidden="true" hidden></div>
  </section>
  <div id="form-feedback" role="status" aria-live="polite"></div>
  <section id="detail" hidden tabindex="-1" aria-label="Current saved version"></section>
  <dialog id="edit-dialog" aria-label="Edit reminder"><div id="edit-surface"></div></dialog>
  <section id="browse" hidden aria-labelledby="view-title">
    <div class="view-heading">
      <h1 id="view-title" tabindex="-1">Reminders</h1>
      <button id="new-reminder" type="button" class="primary">+ New reminder</button>
    </div>
    <div id="upcoming" aria-live="polite"></div>
    <div id="history" hidden aria-live="polite"></div>
  </section>
  <section id="settings" hidden aria-labelledby="settings-title">
    <div class="view-heading"><h1 id="settings-title">Settings</h1></div>
    <div class="settings">
      <section class="panel" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <label for="theme">Mode</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <div class="palette">
          <p id="palette-label">Color theme</p>
          <button id="palette-trigger" type="button" class="palette-trigger" popovertarget="palette"
                  aria-labelledby="palette-label palette-value" data-swatch="purple">
            <span class="swatch" aria-hidden="true"></span><span id="palette-value">Purple</span>
            <span class="palette-chevron" aria-hidden="true"></span>
          </button>
          <div id="palette" popover role="group" aria-labelledby="palette-label">
            <button type="button" class="palette-option" data-swatch="purple" aria-pressed="true">
              <span class="swatch" aria-hidden="true"></span>Purple
            </button>
            <button type="button" class="palette-option" data-swatch="pink" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Pink
            </button>
            <button type="button" class="palette-option" data-swatch="red" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Red
            </button>
            <button type="button" class="palette-option" data-swatch="orange" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Orange
            </button>
            <button type="button" class="palette-option" data-swatch="yellow" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Yellow
            </button>
            <button type="button" class="palette-option" data-swatch="green" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Green
            </button>
            <button type="button" class="palette-option" data-swatch="cyan" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Cyan
            </button>
            <button type="button" class="palette-option" data-swatch="blue" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Blue
            </button>
            <button type="button" class="palette-option" data-swatch="brown" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Brown
            </button>
            <button type="button" class="palette-option" data-swatch="black" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Black
            </button>
            <button type="button" class="palette-option" data-swatch="colorful" aria-pressed="false">
              <span class="swatch" aria-hidden="true"></span>Colorful
            </button>
          </div>
        </div>
      </section>
      <form id="recipient-form" class="panel">
        <h2>Your number</h2>
        <label for="phone">Number for reminders</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+12035550100" maxlength="32" required>
        <p class="hint">Use your own number with its country code. Sending is simulated.</p>
        <button id="save-number" type="submit" class="primary" disabled>Save number</button>
      </form>
    </div>
  </section>
  <noscript><p>Enable JavaScript to use TextLoop.</p></noscript>
</main>
</body>
</html>
