<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TextLoop</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header>
  <div class="header-inner">
    <p class="brand">Text<span>Loop</span></p>
    <button id="refresh" type="button" class="quiet">Refresh</button>
    <nav aria-label="Reminders">
      <button id="home" type="button" aria-pressed="true" data-navigation>Home</button>
      <button id="history-tab" type="button" aria-pressed="false" data-navigation>History</button>
    </nav>
  </div>
</header>
<main>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="saved-retry" hidden aria-label="Unconfirmed save"></section>
  <section id="editor" hidden aria-labelledby="editor-title">
    <button id="back" type="button" class="quiet back">Back to reminders</button>
    <div class="heading">
      <div>
        <h1 id="editor-title" tabindex="-1">New reminder</h1>
        <p id="editor-help" class="hint">What would you like to remember?</p>
      </div>
    </div>
    <form id="reminder-form" class="panel">
      <fieldset id="fields" disabled>
        <legend class="sr-only">Reminder details</legend>
        <label for="message">Message</label>
        <textarea id="message" name="message" maxlength="1000" rows="4" required></textarea>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" maxlength="255" required>
        <label for="scheduled-at">Date and time</label>
        <input id="scheduled-at" name="scheduledAt" type="datetime-local" step="60" required aria-describedby="time-help">
        <p id="time-help" class="hint">Choose a future time.</p>
        <div class="actions form-actions">
          <button id="save" type="submit" class="primary">Schedule reminder</button>
          <button id="cancel" type="button">Cancel</button>
        </div>
      </fieldset>
    </form>
  </section>
  <div id="form-feedback" role="status" aria-live="polite"></div>
  <section id="detail" hidden aria-label="Current saved version"></section>
  <section id="browse" aria-labelledby="view-title">
    <div class="heading browse-heading">
      <h1 id="view-title" tabindex="-1">Your reminders</h1>
      <button id="new-reminder" type="button" class="primary">+ New reminder</button>
      <p id="view-help" class="hint">Scheduled texts and sends that need attention.</p>
    </div>
    <div id="upcoming" aria-live="polite"></div>
    <div id="history" hidden aria-live="polite"></div>
  </section>
  <footer>
    <p>Local preview. No real texts are sent. Times use the server's local timezone.</p>
  </footer>
  <noscript><p>Enable JavaScript to use TextLoop.</p></noscript>
</main>
</body>
</html>
